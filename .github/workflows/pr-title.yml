# Squash merges use the PR title as the commit on main, and semantic-release
# reads those commits to pick the next version. So the title must be a
# Conventional Commit: "feat: ...", "fix: ...", "feat!: ..." and so on.
name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep the subject imperative and capitalised, as CONTRIBUTING asks:
          # "fix: Give quest reward items on turn-in".
          subjectPattern: ^[A-Z].+[^.]$
          subjectPatternError: |
            The subject "{subject}" in "{title}" must start with a capital
            letter and must not end with a full stop.
